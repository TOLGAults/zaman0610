<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Smart Pendant Experience</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #ff1493;
            --secondary-color: #ff69b4;
            --glow-color: rgba(255, 20, 147, 0.4);
            --bg-color: #050105;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--secondary-color);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .neon-font {
            font-family: 'Orbitron', sans-serif;
        }

        .neon-glow-primary {
            text-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color), 0 0 30px var(--secondary-color), 0 0 40px var(--secondary-color);
        }

        .neon-glow-box {
            box-shadow: 0 0 30px var(--glow-color), inset 0 0 25px rgba(255, 255, 255, 0.05);
            border: 2px solid var(--secondary-color);
        }

        /* Matrix Rain Canvas */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Floating hearts and butterflies layer */
        #floating-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            80% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        .floating-item {
            position: absolute;
            bottom: -60px;
            animation: floatUp linear infinite;
        }

        .content-layer {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <!-- Matrix Rain Background -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Floating Icons Layer -->
    <div id="floating-container"></div>

    <!-- Header Section -->
    <header class="w-full text-center mt-6 md:mt-10 content-layer">
        <div id="badge-wrapper" class="inline-block px-4 py-1.5 rounded-full bg-black/60 border backdrop-blur-md mb-4 shadow-lg">
            <span id="badge-text" class="text-xs md:text-sm tracking-widest uppercase neon-font"></span>
        </div>
        <h1 id="names-heading" class="text-4xl md:text-7xl font-black tracking-wider neon-font neon-glow-primary mb-2">
            <!-- Dynamic Names -->
        </h1>
        <p id="subtitle-text" class="text-sm md:text-base tracking-widest uppercase font-semibold opacity-90">
            <!-- Dynamic Subtitle -->
        </p>
    </header>

    <!-- Main Card Container -->
    <main class="w-full max-w-2xl bg-black/70 backdrop-blur-xl rounded-3xl p-6 md:p-10 neon-glow-box content-layer my-8 text-center relative overflow-hidden">
        
        <!-- Background Corner Glows -->
        <div id="glow-corner-1" class="absolute -top-12 -left-12 w-32 h-32 rounded-full blur-2xl pointer-events-none opacity-40"></div>
        <div id="glow-corner-2" class="absolute -bottom-12 -right-12 w-32 h-32 rounded-full blur-2xl pointer-events-none opacity-40"></div>

        <div class="mb-6">
            <i id="main-icon" class="fa-solid fa-heart-pulse text-4xl animate-pulse mb-2 block"></i>
            <h2 id="box-title" class="text-xl md:text-2xl font-bold mt-2 neon-font text-white"></h2>
            <p id="start-date-text" class="text-xs opacity-80 mt-1"></p>
        </div>

        <!-- Timer Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 my-6">
            <div class="bg-black/50 border border-white/20 rounded-2xl p-4 backdrop-blur-md shadow-inner">
                <span id="days" class="text-3xl md:text-5xl font-black text-white neon-font neon-glow-primary block">00</span>
                <span class="text-xs uppercase tracking-widest opacity-80 mt-1 block">Gün</span>
            </div>
            <div class="bg-black/50 border border-white/20 rounded-2xl p-4 backdrop-blur-md shadow-inner">
                <span id="hours" class="text-3xl md:text-5xl font-black text-white neon-font neon-glow-primary block">00</span>
                <span class="text-xs uppercase tracking-widest opacity-80 mt-1 block">Saat</span>
            </div>
            <div class="bg-black/50 border border-white/20 rounded-2xl p-4 backdrop-blur-md shadow-inner">
                <span id="minutes" class="text-3xl md:text-5xl font-black text-white neon-font neon-glow-primary block">00</span>
                <span class="text-xs uppercase tracking-widest opacity-80 mt-1 block">Dakika</span>
            </div>
            <div class="bg-black/50 border border-white/20 rounded-2xl p-4 backdrop-blur-md shadow-inner">
                <span id="seconds" class="text-3xl md:text-5xl font-black text-white neon-font neon-glow-primary block">00</span>
                <span class="text-xs uppercase tracking-widest opacity-80 mt-1 block">Saniye</span>
            </div>
        </div>

        <!-- Romantic Quote Section -->
        <div class="mt-8 pt-6 border-t border-white/20">
            <p id="quote-text" class="text-white/90 text-base md:text-lg italic font-light leading-relaxed px-4">
                <!-- Dynamic Quote -->
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center pb-4 content-layer">
        <p id="footer-text" class="text-xs tracking-widest uppercase opacity-70">
            <!-- Dynamic Footer -->
        </p>
    </footer>

    <!-- Configuration and Logic -->
    <script>
        /* ==========================================================================
           KOLAY AYAR ALANI (CONFIG)
           Sadece bu bölümü değiştirerek yeni müşterilerinize özel tasarım üretebilirsiniz!
           ========================================================================== */
        const CONFIG = {
            // 1. İSİMLER
            firstName: "Ayşe",
            secondName: "Tolga",

            // 2. TEMA RENK SEÇENEKLERİ:
            // "pink" (Pembe) | "yellow" (Sarı) | "green" (Yeşil) | "white" (Beyaz/Gümüş)
            theme: "yellow",

            // 3. TARİH AYARLARI
            // Sayaç için başlangıç tarihi (Format: YYYY-MM-DDTHH:mm:ss)
            startDateISO: "2010-10-24T00:00:00",
            // Ekranda görünecek tarih etiketi
            startDateLabel: "Başlangıç: 24 Ekim 2010",

            // 4. EKRAN METİNLERİ
            badgeText: "",
            subtitleText: "Time in Time • ",
            boxTitle: "Birlikte Geçen Mucizevi Zaman",
            quoteText: "Zamanın en güzel akışında, seninle geçen her an bir mucize... İyi ki varsın.",
            footerText: "T & G • NFC Smart Jewelry Design"
        };

        // Renk Palet Tanımları (Matrix, Glow ve Floating Öğeler için)
        const THEMES = {
            pink: {
                primary: "#ff1493",
                secondary: "#ff69b4",
                glow: "rgba(255, 20, 147, 0.4)",
                bg: "#050105",
                matrixBg: "rgba(5, 1, 5, 0.15)"
            },
            yellow: {
                primary: "#ffd700",
                secondary: "#ffea00",
                glow: "rgba(255, 215, 0, 0.4)",
                bg: "#050500",
                matrixBg: "rgba(5, 5, 0, 0.15)"
            },
            green: {
                primary: "#00ff66",
                secondary: "#55ff99",
                glow: "rgba(0, 255, 102, 0.4)",
                bg: "#000502",
                matrixBg: "rgba(0, 5, 2, 0.15)"
            },
            white: {
                primary: "#e0f7fa",
                secondary: "#ffffff",
                glow: "rgba(255, 255, 255, 0.3)",
                bg: "#030508",
                matrixBg: "rgba(3, 5, 8, 0.15)"
            }
        };

        // Temayı Uygula
        const currentTheme = THEMES[CONFIG.theme] || THEMES.pink;
        document.documentElement.style.setProperty('--primary-color', currentTheme.primary);
        document.documentElement.style.setProperty('--secondary-color', currentTheme.secondary);
        document.documentElement.style.setProperty('--glow-color', currentTheme.glow);
        document.documentElement.style.setProperty('--bg-color', currentTheme.bg);

        // İçerikleri HTML'e aktar
        document.getElementById('badge-text').innerText = CONFIG.badgeText;
        document.getElementById('badge-wrapper').style.borderColor = currentTheme.secondary + '60';
        document.getElementById('badge-text').style.color = currentTheme.secondary;

        document.getElementById('names-heading').innerHTML = `${CONFIG.firstName} <span class="text-white text-3xl md:text-6xl">&</span> ${CONFIG.secondName}`;
        document.getElementById('subtitle-text').innerText = CONFIG.subtitleText;
        document.getElementById('box-title').innerText = CONFIG.boxTitle;
        document.getElementById('start-date-text').innerText = CONFIG.startDateLabel;
        document.getElementById('quote-text').innerText = `"${CONFIG.quoteText}"`;
        document.getElementById('footer-text').innerText = CONFIG.footerText;

        document.getElementById('main-icon').style.color = currentTheme.primary;
        document.getElementById('main-icon').style.filter = `drop-shadow(0 0 10px ${currentTheme.primary})`;

        document.getElementById('glow-corner-1').style.backgroundColor = currentTheme.primary;
        document.getElementById('glow-corner-2').style.backgroundColor = currentTheme.primary;

        // --- MATRIX RAIN EFFECT ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const cleanFirstName = CONFIG.firstName.toUpperCase().replace(/[^A-Z0-9]/g, '');
        const cleanSecondName = CONFIG.secondName.toUpperCase().replace(/[^A-Z0-9]/g, '');
        const characters = `0123456789${cleanFirstName}${cleanSecondName}TIMEINHEART<3`;
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = Math.floor(Math.random() * -100);
        }

        function drawMatrix() {
            ctx.fillStyle = currentTheme.matrixBg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                
                if (Math.random() > 0.85) {
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.fillStyle = currentTheme.primary;
                }

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // --- FLOATING HEARTS & BUTTERFLIES GENERATOR ---
        const container = document.getElementById('floating-container');
        const icons = [
            'fa-solid fa-heart', 
            'fa-solid fa-butterfly', 
            'fa-solid fa-feather', 
            'fa-solid fa-sparkles',
            'fa-solid fa-ring'
        ];

        function createFloatingElement() {
            const el = document.createElement('div');
            el.className = 'floating-item';
            
            const iconClass = icons[Math.floor(Math.random() * icons.length)];
            const size = Math.floor(Math.random() * 18 + 14);
            el.innerHTML = `<i class="${iconClass}" style="color: ${currentTheme.secondary}; font-size: ${size}px; filter: drop-shadow(0 0 10px ${currentTheme.primary});"></i>`;
            
            el.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 6 + 7;
            el.style.animationDuration = duration + 's';
            
            container.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, duration * 1000);
        }

        setInterval(createFloatingElement, 400);

        // --- TIME COUNTER LOGIC ---
        function updateTimer() {
            const startDate = new Date(CONFIG.startDateISO).getTime();
            const now = new Date().getTime();
            const difference = now - startDate;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = String(days).padStart(2, '0');
                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            } else {
                document.getElementById('days').innerText = '00';
                document.getElementById('hours').innerText = '00';
                document.getElementById('minutes').innerText = '00';
                document.getElementById('seconds').innerText = '00';
            }
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
